<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UI/UX Case Studies | Katrine Portfolio</title>

  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#07050b',
            text: '#e8e5f0',
            accent: '#a855f7',
            secondary: '#7c3aed'
          },
          fontFamily: {
            clash: ['Clash Display', 'sans-serif'],
            syne: ['Syne', 'sans-serif'],
            manrope: ['Manrope', 'sans-serif']
          }
        }
      }
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>

  <style>
    body { overflow-x: hidden; }
    .ui-card:hover .card-bg-img { transform: scale(1.08); opacity: 0.65; }
  </style>
</head>
<body class="bg-bg text-text font-manrope">
  <div class="fixed inset-0 pointer-events-none bg-[radial-gradient(circle_at_18%_18%,rgba(124,58,237,0.22),transparent_28%),radial-gradient(circle_at_80%_20%,rgba(168,85,247,0.15),transparent_22%),radial-gradient(circle_at_50%_80%,rgba(76,29,149,0.12),transparent_25%)]"></div>

  <header class="fixed top-0 left-0 w-full z-50 border-b border-white/10 bg-black/40 backdrop-blur-xl">
    <div class="px-[5vw] py-5 flex items-center justify-between">
      <a href="../index.html" class="font-clash text-xl md:text-2xl uppercase tracking-[2px] text-white hover:text-accent transition">KATRINE.</a>

      <div class="flex items-center gap-3">
        <a href="../index.html" class="rounded-full border border-white/10 bg-white/5 px-5 py-3 font-syne text-[11px] uppercase tracking-[2px] text-white/85 transition hover:bg-white/10">
          ← Back to Home
        </a>
      </div>
    </div>
  </header>

  <main class="relative z-10">
    <section class="min-h-[70vh] pt-[140px] pb-[60px] px-[5vw] flex items-end">
      <div class="w-full">
        <p class="font-syne text-[11px] md:text-sm uppercase tracking-[4px] text-accent font-semibold mb-4">04 / Design Track</p>
        <div class="grid grid-cols-1 lg:grid-cols-[1.1fr_.9fr] gap-10 items-end">
          <div>
            <h1 class="font-clash text-[14vw] md:text-[7vw] leading-[0.88] uppercase text-white max-w-[900px]">
              UI/UX & Systems Architecture
            </h1>
          </div>
          <div class="max-w-[560px] lg:ml-auto">
            <p class="text-white/75 text-base md:text-xl leading-relaxed">
              5 interface and experience case studies for playable systems, tactical HUDs, diegetic menus, onboarding flows, and game usability.
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- Filters & Case Studies Grid -->
    <section class="px-[5vw] pb-[140px]">
      <div class="flex flex-wrap items-center justify-between gap-4 mb-10 pb-6 border-b border-white/10">
        <div>
          <p class="font-syne text-[11px] uppercase tracking-[3px] text-white/45 mb-1">Interactive Showcase</p>
          <h2 class="font-clash text-[8vw] md:text-[3vw] uppercase leading-[0.95] text-white">Case Studies</h2>
        </div>

        <div class="flex flex-wrap gap-2" id="filterContainer">
          <button data-filter="all" class="filter-btn active rounded-full border border-accent bg-accent/20 px-4 py-2 font-syne text-[11px] uppercase tracking-[2px] text-white">All</button>
          <button data-filter="HUD" class="filter-btn rounded-full border border-white/10 bg-white/5 px-4 py-2 font-syne text-[11px] uppercase tracking-[2px] text-white/70 hover:border-white/30">HUD</button>
          <button data-filter="Menus" class="filter-btn rounded-full border border-white/10 bg-white/5 px-4 py-2 font-syne text-[11px] uppercase tracking-[2px] text-white/70 hover:border-white/30">Menus</button>
          <button data-filter="Systems" class="filter-btn rounded-full border border-white/10 bg-white/5 px-4 py-2 font-syne text-[11px] uppercase tracking-[2px] text-white/70 hover:border-white/30">Systems</button>
          <button data-filter="Usability" class="filter-btn rounded-full border border-white/10 bg-white/5 px-4 py-2 font-syne text-[11px] uppercase tracking-[2px] text-white/70 hover:border-white/30">Usability</button>
        </div>
      </div>

      <div id="uiGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <!-- Case Study Modal -->
  <div id="modalOverlay" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="relative w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-[28px] border border-white/15 bg-[#0f0a1a] p-6 md:p-10 shadow-2xl">
      <button id="closeModal" class="absolute top-6 right-6 w-10 h-10 rounded-full border border-white/20 bg-white/10 flex items-center justify-center text-white text-xl hover:bg-white/20">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const lenis = new Lenis({
      duration: 1.05,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t))
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    const uiCaseStudies = [
      {
        id: 1,
        title: "Tactical HUD & Diegetic Overlay",
        category: "HUD",
        subtitle: "Minimalist in-combat feedback for high-speed action games.",
        description: "A complete heads-up display overhaul focusing on cognitive load reduction, peripheral vision indicators, and dynamic ammo/stamina states integrated directly into character geometry.",
        image: "https://images.unsplash.com/photo-1581291518633-83b4ebd1d83e?w=1600&q=80",
        tags: ["HUD", "Diegetic UI", "Combat", "Usability"],
        metrics: ["40% Faster Readability", "Zero Screen Clutter", "60 FPS Render Efficiency"]
      },
      {
        id: 2,
        title: "Sci-Fi Main Menu & Radial Navigation",
        category: "Menus",
        subtitle: "Immersive 3D menu transitions with audio feedback.",
        description: "Seamless spatial menu architecture using 3D perspective cards, instant keyboard/controller remapping, and audio-reactive navigation nodes.",
        image: "https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?w=1600&q=80",
        tags: ["Menus", "Spatial UI", "Gamepad UX", "Audio"],
        metrics: ["100% Controller Native", "Smooth GSAP Motion", "Accessibility First"]
      },
      {
        id: 3,
        title: "Skill Tree & Node Progression UX",
        category: "Systems",
        subtitle: "Interactive branch customization for action RPGs.",
        description: "Visualizing complex dependency trees with clear upgrade node feedback, undo history, build preset saving, and instant stat comparison cards.",
        image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1600&q=80",
        tags: ["Systems", "Skill Tree", "Progression", "UX Architecture"],
        metrics: ["Preset Share Codes", "Node Search Filter", "Instant Re-spec UX"]
      },
      {
        id: 4,
        title: "Inventory & Grid Drag-and-Drop",
        category: "Systems",
        subtitle: "Weight management and quick-slot assignment.",
        description: "Grid-based inventory system featuring auto-sort heuristics, item weight tooltips, craft-from-container shortcuts, and haptic drag feedback.",
        image: "https://images.unsplash.com/photo-1542744094-3a3172720449?w=1600&q=80",
        tags: ["Systems", "Inventory", "Drag & Drop", "UX"],
        metrics: ["Sub-10ms Drag Response", "Auto-Sort Algorithm", "Gamepad Grid Navigation"]
      },
      {
        id: 5,
        title: "Player Onboarding & Tutorial Usability",
        category: "Usability",
        subtitle: "Context-aware prompts and non-intrusive guides.",
        description: "UX design study analyzing player drop-off during early game levels. Implemented contextual tutorial triggers that adapt to player skill speed.",
        image: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=1600&q=80",
        tags: ["Usability", "Onboarding", "UX Research", "Flow"],
        metrics: ["+35% Tutorial Completion", "Adaptive Hint Timing", "User Testing Verified"]
      }
    ];

    const uiGrid = document.getElementById("uiGrid");
    const modalOverlay = document.getElementById("modalOverlay");
    const closeModal = document.getElementById("closeModal");
    const modalContent = document.getElementById("modalContent");

    function renderCards(filter = "all") {
      uiGrid.innerHTML = "";
      const filtered = filter === "all" ? uiCaseStudies : uiCaseStudies.filter(c => c.category === filter);

      filtered.forEach((study, idx) => {
        const card = document.createElement("div");
        card.className = "ui-card group relative min-h-[460px] cursor-pointer overflow-hidden rounded-[30px] border border-white/10 bg-white/[0.03] p-8 flex flex-col justify-between transition-all duration-500 hover:border-accent/50 hover:shadow-[0_20px_60px_rgba(168,85,247,0.2)]";
        card.onclick = () => openCaseStudy(study);

        card.innerHTML = `
          <div class="absolute inset-0 bg-gradient-to-t from-bg via-bg/40 to-transparent z-10"></div>
          <img src="${study.image}" alt="${study.title}" class="card-bg-img absolute inset-0 h-full w-full object-cover opacity-45 transition-transform duration-700" />

          <div class="relative z-20 flex items-start justify-between">
            <span class="rounded-full border border-white/20 bg-black/40 px-3 py-1 text-[10px] uppercase tracking-[2px] text-accent backdrop-blur-md">${study.category}</span>
            <span class="font-clash text-4xl text-white/20 font-bold">0${study.id}</span>
          </div>

          <div class="relative z-20 mt-20">
            <h3 class="font-clash text-3xl md:text-4xl font-semibold text-white uppercase leading-tight group-hover:text-accent transition-colors">${study.title}</h3>
            <p class="mt-3 text-white/75 text-sm md:text-base leading-relaxed">${study.subtitle}</p>

            <div class="mt-6 flex flex-wrap gap-2">
              ${study.tags.map(t => `<span class="rounded-full bg-white/10 border border-white/15 px-3 py-1 text-[10px] uppercase tracking-[1px] text-white/80">${t}</span>`).join('')}
            </div>

            <div class="mt-6 inline-flex items-center gap-2 font-syne text-xs uppercase tracking-[2px] text-accent group-hover:translate-x-2 transition-transform">
              View Case Study →
            </div>
          </div>
        `;
        uiGrid.appendChild(card);
      });

      gsap.from(".ui-card", {
        opacity: 0,
        y: 40,
        stagger: 0.1,
        duration: 0.7,
        ease: "power3.out"
      });
    }

    function openCaseStudy(study) {
      modalContent.innerHTML = `
        <span class="inline-block rounded-full bg-accent/20 border border-accent px-4 py-1 text-xs uppercase tracking-[2px] text-accent mb-4">${study.category} Case Study</span>
        <h2 class="font-clash text-4xl md:text-5xl uppercase text-white font-bold leading-tight">${study.title}</h2>
        <p class="mt-2 text-accent/80 text-lg">${study.subtitle}</p>

        <div class="my-6 h-[320px] md:h-[420px] w-full overflow-hidden rounded-2xl border border-white/15">
          <img src="${study.image}" alt="${study.title}" class="h-full w-full object-cover" />
        </div>

        <p class="text-white/85 text-base md:text-lg leading-relaxed mb-6">${study.description}</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 my-6">
          ${study.metrics.map(m => `
            <div class="rounded-xl border border-white/10 bg-white/5 p-4 text-center">
              <span class="font-syne text-sm text-accent tracking-[1px] uppercase">${m}</span>
            </div>
          `).join('')}
        </div>
      `;
      modalOverlay.classList.remove("hidden");
    }

    closeModal.onclick = () => modalOverlay.classList.add("hidden");
    modalOverlay.onclick = (e) => { if (e.target === modalOverlay) modalOverlay.classList.add("hidden"); };

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => {
          b.classList.remove("active", "border-accent", "bg-accent/20");
          b.classList.add("border-white/10", "bg-white/5", "text-white/70");
        });
        btn.classList.add("active", "border-accent", "bg-accent/20", "text-white");
        btn.classList.remove("border-white/10", "bg-white/5", "text-white/70");
        renderCards(btn.dataset.filter);
      });
    });

    renderCards();
  </script>
</body>
</html>
