<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unreal Engine Projects | Katrine Portfolio</title>

  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0c0706',
            text: '#f2eae1',
            accent: '#ff5a36',
            glow: '#7c2d12'
          },
          fontFamily: {
            clash: ['Clash Display', 'sans-serif'],
            syne: ['Syne', 'sans-serif'],
            manrope: ['Manrope', 'sans-serif']
          }
        }
      }
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <style>
    .site-nav { background: linear-gradient(180deg, rgba(4,6,8,.85), rgba(4,6,8,0)); }
    .nav-inner { border: 1px solid rgba(255,255,255,.12); background: rgba(8,14,20,.65); box-shadow: 0 12px 40px rgba(0,0,0,.45); backdrop-filter: blur(20px); }
  </style>
</head>
<body class="bg-bg text-text font-manrope">
  <div class="fixed inset-0 pointer-events-none bg-[radial-gradient(circle_at_18%_18%,rgba(255,90,54,0.18),transparent_28%),radial-gradient(circle_at_80%_20%,rgba(124,45,18,0.15),transparent_22%)]"></div>

  <!-- Floating Navigation -->
  <nav class="site-nav fixed top-0 z-50 w-full px-[14px] py-[14px] md:px-[30px] md:py-[20px]">
    <div class="nav-inner flex items-center justify-between rounded-full px-5 py-3 md:px-7 md:py-4">
      <a href="../index.html" class="flex items-center gap-2 font-bold tracking-[2px] text-white no-underline">
        <span class="inline-block h-2 w-2 rounded-full bg-[#00f59b] shadow-[0_0_8px_#00f59b]"></span>
        <span>KATRINE.</span>
      </a>
      <div class="flex items-center gap-5 text-[11px] md:text-sm">
        <a href="../index.html#projects-showcase" class="text-white/70 transition hover:text-[#00f59b] no-underline">WORK</a>
        <a href="../index.html#experience" class="text-white/70 transition hover:text-[#00f59b] no-underline">INFO</a>
        <a href="../index.html#vault" class="text-white/70 transition hover:text-[#00f59b] no-underline">VAULT</a>
        <a href="../index.html" class="rounded-full border border-white/15 bg-white/5 px-4 py-1.5 font-syne text-[10px] uppercase tracking-[2px] text-white transition hover:border-[#00f59b] hover:text-[#00f59b] no-underline">← Back to Portfolio</a>
      </div>
    </div>
  </nav>

  <main class="relative z-10">
    <section class="min-h-[65vh] pt-[140px] pb-[60px] px-[5vw] flex items-end">
      <div class="w-full">
        <p class="font-syne text-[11px] md:text-sm uppercase tracking-[4px] text-accent font-semibold mb-4">02 / Engine Track</p>
        <div class="grid grid-cols-1 lg:grid-cols-[1.1fr_.9fr] gap-10 items-end">
          <div>
            <h1 class="font-clash text-[14vw] md:text-[7vw] leading-[0.88] uppercase text-white max-w-[900px]">
              Unreal Engine 5 Prototypes
            </h1>
          </div>
          <div class="max-w-[560px] lg:ml-auto">
            <p class="text-white/75 text-base md:text-xl leading-relaxed">
              5 weekly Blueprint-driven prototypes with cinematic ambition, combat systems, mood lighting, and immersive scene building.
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- Unreal Projects Grid -->
    <section class="px-[5vw] pb-[140px]">
      <div class="mb-10 pb-6 border-b border-white/10">
        <p class="font-syne text-[11px] uppercase tracking-[3px] text-white/45 mb-1">Blueprint & UE5 Builds</p>
        <h2 class="font-clash text-[8vw] md:text-[3vw] uppercase leading-[0.95] text-white">Unreal Case Studies</h2>
      </div>

      <div id="unrealGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const lenis = new Lenis({ duration: 1.05, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)) });
    function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);

    const unrealProjects = [
      {
        title: "Ashen Siege - Combat System",
        type: "Blueprint Combat",
        features: ["Combo Chaining", "Target Lock-On", "Hit Stop & Trauma Camera"],
        image: "https://images.unsplash.com/photo-1633613286848-e6f43bbafb8d?w=1600&q=80",
        version: "Unreal Engine 5.4"
      },
      {
        title: "Volcanic Descent - Lumen Lighting",
        type: "Level & Lighting",
        features: ["Dynamic Volumetric Fog", "Lumen GI", "Niagara Lava FX"],
        image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1600&q=80",
        version: "Unreal Engine 5.3"
      },
      {
        title: "Quantum Breach - Quest Logic",
        type: "Systems & Logic",
        features: ["State Machine AI", "Interactive Terminals", "Cinematic Sequences"],
        image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1600&q=80",
        version: "Unreal Engine 5.4"
      },
      {
        title: "Ghost City - Nanite Environment",
        type: "World Building",
        features: ["PCG Procedural Foliage", "Control Rig Character", "Custom Shaders"],
        image: "https://images.unsplash.com/photo-1518709268805-4e9042af2176?w=1600&q=80",
        version: "Unreal Engine 5.3"
      }
    ];

    const unrealGrid = document.getElementById("unrealGrid");
    unrealProjects.forEach((proj, i) => {
      const card = document.createElement("div");
      card.className = "group relative min-h-[440px] overflow-hidden rounded-[30px] border border-white/10 bg-white/[0.03] p-8 flex flex-col justify-between transition-all duration-500 hover:border-accent/50 hover:shadow-[0_20px_60px_rgba(255,90,54,0.2)]";

      card.innerHTML = `
        <div class="absolute inset-0 bg-gradient-to-t from-bg via-bg/40 to-transparent z-10"></div>
        <img src="${proj.image}" alt="${proj.title}" class="absolute inset-0 h-full w-full object-cover opacity-45 transition-transform duration-700 group-hover:scale-108 group-hover:opacity-65" />

        <div class="relative z-20 flex items-start justify-between">
          <span class="rounded-full border border-white/20 bg-black/40 px-3 py-1 text-[10px] uppercase tracking-[2px] text-accent backdrop-blur-md">${proj.type}</span>
          <span class="font-clash text-4xl text-white/20 font-bold">0${i + 1}</span>
        </div>

        <div class="relative z-20 mt-20">
          <h3 class="font-clash text-3xl font-semibold text-white uppercase group-hover:text-accent transition-colors">${proj.title}</h3>
          <p class="mt-2 text-white/60 text-xs tracking-[1px] uppercase">${proj.version}</p>

          <div class="mt-4 flex flex-wrap gap-2">
            ${proj.features.map(f => `<span class="rounded-full bg-white/10 border border-white/15 px-3 py-1 text-[10px] uppercase tracking-[1px] text-white/80">${f}</span>`).join('')}
          </div>
        </div>
      `;
      unrealGrid.appendChild(card);
    });

    gsap.from("#unrealGrid > div", { opacity: 0, y: 40, stagger: 0.1, duration: 0.7, ease: "power3.out" });
  </script>
</body>
</html>
